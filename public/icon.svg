<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#1c1917" stop-opacity="1" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base (Full rounded square) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" fill="none" />

  <!-- Ambient Light Ring -->
  <circle cx="256" cy="240" r="180" fill="#f59e0b" opacity="0.12" filter="blur(30px)" />

  <g filter="url(#shadow)">
    <!-- OPEN BOOK / DICTIONARY BASE -->
    <!-- Left Cover -->
    <path d="M 96 340 C 130 355 200 355 248 335 L 248 215 C 200 235 130 235 96 220 Z" fill="#78350f" stroke="#b45309" stroke-width="4" />
    <!-- Right Cover -->
    <path d="M 416 340 C 382 355 312 355 264 335 L 264 215 C 312 235 382 235 416 220 Z" fill="#78350f" stroke="#b45309" stroke-width="4" />

    <!-- Left Pages Stack -->
    <path d="M 102 332 C 140 348 205 348 248 328 L 248 208 C 205 228 140 228 102 212 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <path d="M 106 325 C 145 340 210 340 248 320 L 248 200 C 210 220 145 220 106 205 Z" fill="#fffbeb" />

    <!-- Right Pages Stack -->
    <path d="M 410 332 C 372 348 307 348 264 328 L 264 208 C 307 228 372 228 410 212 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <path d="M 406 325 C 367 340 302 340 264 320 L 264 200 C 302 220 367 220 406 205 Z" fill="#fffbeb" />

    <!-- Book Spine Center Binding -->
    <path d="M 248 200 C 253 203 259 203 264 200 L 264 335 C 259 338 253 338 248 335 Z" fill="#92400e" />

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M 252 200 L 252 380 L 256 372 L 260 380 L 260 200 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Left Page Texture Lines (Dictionary text lines) -->
    <line x1="124" y1="230" x2="228" y2="224" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="124" y1="246" x2="228" y2="240" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="124" y1="262" x2="228" y2="256" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="124" y1="278" x2="228" y2="272" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="124" y1="294" x2="190" y2="289" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- Right Page Texture Lines -->
    <line x1="284" y1="224" x2="388" y2="230" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="284" y1="240" x2="388" y2="246" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="284" y1="256" x2="388" y2="262" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="284" y1="272" x2="388" y2="278" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <line x1="284" y1="288" x2="350" y2="293" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

    <!-- BIG EMBOSSED 'D' ON LEFT PAGE -->
    <text x="148" y="280" font-family="'Playfair Display', serif, Georgia" font-size="64" font-weight="900" fill="#b45309" opacity="0.25">D</text>
  </g>

  <!-- RUNNING STICKMAN WITH CROWN ATOP THE DICTIONARY -->
  <g filter="url(#glow)">
    <!-- Crown atop Stickman -->
    <g transform="translate(242, 60)">
      <polygon points="0,18 7,6 14,13 21,6 28,18" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />
      <circle cx="7" cy="6" r="2.5" fill="#ef4444" />
      <circle cx="14" cy="12" r="2.5" fill="#3b82f6" />
      <circle cx="21" cy="6" r="2.5" fill="#10b981" />
    </g>

    <!-- Stickman Head -->
    <circle cx="256" cy="104" r="24" stroke="url(#goldLight)" stroke-width="7" fill="#1c1917" />
    <!-- Eyes -->
    <circle cx="249" cy="102" r="3.5" fill="#fef08a" />
    <circle cx="263" cy="102" r="3.5" fill="#fef08a" />
    <!-- Smile -->
    <path d="M 248 112 Q 256 119 264 112" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Stickman Torso -->
    <line x1="256" y1="128" x2="256" y2="180" stroke="url(#goldLight)" stroke-width="7.5" stroke-linecap="round" />

    <!-- Stickman Running Arms -->
    <line x1="256" y1="138" x2="232" y2="156" stroke="url(#goldLight)" stroke-width="7" stroke-linecap="round" />
    <line x1="232" y1="156" x2="218" y2="142" stroke="url(#goldLight)" stroke-width="6.5" stroke-linecap="round" />

    <line x1="256" y1="138" x2="280" y2="156" stroke="url(#goldLight)" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="156" x2="295" y2="146" stroke="url(#goldLight)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Stickman Running Legs -->
    <line x1="256" y1="180" x2="232" y2="204" stroke="url(#goldLight)" stroke-width="7.5" stroke-linecap="round" />
    <line x1="232" y1="204" x2="216" y2="226" stroke="url(#goldLight)" stroke-width="7" stroke-linecap="round" />

    <line x1="256" y1="180" x2="280" y2="204" stroke="url(#goldLight)" stroke-width="7.5" stroke-linecap="round" />
    <line x1="280" y1="204" x2="298" y2="222" stroke="url(#goldLight)" stroke-width="7" stroke-linecap="round" />

    <!-- Superhero Fluttering Cape -->
    <path d="M 252 140 Q 210 148 180 185 Q 215 178 248 160 Z" fill="url(#goldGrad)" opacity="0.85" />
  </g>

  <!-- Sparkles & Victory Stars around the character -->
  <path d="M 180 90 Q 185 90 185 85 Q 185 90 190 90 Q 185 90 185 95 Q 185 90 180 90 Z" fill="#fef08a" />
  <path d="M 330 95 Q 336 95 336 89 Q 336 95 342 95 Q 336 95 336 101 Q 336 95 330 95 Z" fill="#fef08a" />
  <path d="M 360 140 Q 365 140 365 135 Q 365 140 370 140 Q 365 140 365 145 Q 365 140 360 140 Z" fill="#fef08a" />

  <!-- TITLE BANNER AT THE BOTTOM -->
  <g filter="url(#shadow)">
    <!-- Elegant Ribbon Banner -->
    <rect x="80" y="408" width="352" height="52" rx="16" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Golden Accent Dots -->
    <circle cx="104" cy="434" r="3.5" fill="url(#goldLight)" />
    <circle cx="408" cy="434" r="3.5" fill="url(#goldLight)" />
    
    <!-- Title Text -->
    <text x="256" y="432" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" fill="url(#goldLight)" text-anchor="middle" letter-spacing="1">
      DICIONÁRIO
    </text>
    <text x="256" y="449" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="3" opacity="0.9">
      BY FABULOUS
    </text>
  </g>
</svg>