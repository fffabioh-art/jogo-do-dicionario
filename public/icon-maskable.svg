    <circle cx="104" cy="434" r="3.5" fill="url(#mGoldLight)" />
    <circle cx="408" cy="434" r="3.5" fill="url(#mGoldLight)" />
    <text x="256" y="432" font-family="'Playfair Display', serif, Georgia" font-size="20" font-weight="900" fill="url(#mGoldLight)" text-anchor="middle" letter-spacing="1">
