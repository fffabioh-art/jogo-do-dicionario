      <circle cx="21" cy="6" r="2.5" fill="#10b981" />
    </g>

    <!-- Stickman Head -->
    <circle cx="256" cy="104" r="24" stroke="url(#mGoldLight)" stroke-width="7" fill="#1c1917" />
    <circle cx="249" cy="102" r="3.5" fill="#fef08a" />
    <circle cx="263" cy="102" r="3.5" fill="#fef08a" />
    <path d="M 248 112 Q 256 119 264 112" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" fill="none" />

