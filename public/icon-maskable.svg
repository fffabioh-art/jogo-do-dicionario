    <!-- Stickman Running Arms -->
    <line x1="256" y1="138" x2="232" y2="156" stroke="url(#mGoldLight)" stroke-width="7" stroke-linecap="round" />
    <line x1="232" y1="156" x2="218" y2="142" stroke="url(#mGoldLight)" stroke-width="6.5" stroke-linecap="round" />
    <line x1="256" y1="138" x2="280" y2="156" stroke="url(#mGoldLight)" stroke-width="7" stroke-linecap="round" />
    <line x1="280" y1="156" x2="295" y2="146" stroke="url(#mGoldLight)" stroke-width="6.5" stroke-linecap="round" />

