    <line x1="232" y1="204" x2="216" y2="226" stroke="url(#mGoldLight)" stroke-width="7" stroke-linecap="round" />
    <line x1="256" y1="180" x2="280" y2="204" stroke="url(#mGoldLight)" stroke-width="7.5" stroke-linecap="round" />
    <line x1="280" y1="204" x2="298" y2="222" stroke="url(#mGoldLight)" stroke-width="7" stroke-linecap="round" />

