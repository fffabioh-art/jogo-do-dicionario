<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mBgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1c1917" stop-opacity="1" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
